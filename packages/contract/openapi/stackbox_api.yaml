components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    org_id:
      name: org_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the organization
    cluster_id:
      name: cluster_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the cluster
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the user
    resource_name:
      name: resource_name
      in: path
      required: true
      schema:
        type: string
      description: The name of the instance resource
    connection_id:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the instance connection
    build_id:
      name: build_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the build
    database:
      name: database
      in: path
      required: true
      schema:
        type: string
      description: The name of the database
  schemas:
    AppConfigResponse:
      type: object
      properties:
        github_oauth:
          type: boolean
          description: True when GitHub OAuth login is configured on the server.
        signup:
          $ref: '#/components/schemas/SignupConfigResponse'
    SignupConfigResponse:
      type: object
      required:
        - turnstile
      properties:
        turnstile:
          $ref: '#/components/schemas/TurnstileConfigResponse'
    TurnstileConfigResponse:
      type: object
      required:
        - enabled
        - site_key
        - action
      properties:
        enabled:
          type: boolean
          description: True when password signup requires a Turnstile challenge.
        site_key:
          type: string
          description: Public Turnstile site key used to render the signup widget.
        action:
          type: string
          description: Turnstile action submitted by the signup widget.
    Organisation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        is_platform:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    UserSignupResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        jwt_token:
          type: string
          description: JWT token for the authenticated user
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
    User:
      type: object
      properties:
        id:
          type: string
          description: User's ID
        name:
          type: string
          description: User's name
        username:
          type: string
          description: User's username
        email:
          type: string
          format: email
          description: User's email address
        organisation:
          type: string
          description: User's organisation
        role:
          $ref: '#/components/schemas/UserRole'
        organisation_id:
          type: string
          description: OrganisationID
    UserList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        total:
          type: integer
          description: Total number of records
        page:
          type: integer
          description: Current page number
        page_size:
          type: integer
          description: Number of items per page
        total_pages:
          type: integer
          description: Total number of pages
    UserSignupRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          description: User's name
        email:
          type: string
          format: email
          description: User's email address
        password:
          type: string
          description: Users desired password
        organisation:
          $ref: '#/components/schemas/Organisation'
        invite_token:
          type: string
          description: Optional invite token for joining an existing organization
        turnstile_token:
          type: string
          description: Turnstile token required for protected public password signup
    UserRole:
      type: string
      enum:
        - OrgAdmin
        - OrgMember
    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: The refresh token to exchange for a new access token
    RefreshTokenResponse:
      type: object
      properties:
        token:
          type: string
          description: New access token
        refreshToken:
          type: string
          description: New refresh token (old one is revoked)
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User's email
        password:
          type: string
          format: password
          description: User's password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token for authenticated requests
        refresh_token:
          type: string
          description: Refresh token for obtaining new access tokens
        user:
          $ref: '#/components/schemas/User'
        expires_in:
          type: integer
          description: Token expiration time in seconds
    PromoteAdminRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          description: The ID of the user to promote to admin
    GitRepoRevision:
      type: object
      properties:
        branch:
          type: string
        tag:
          type: string
        commit:
          type: string
    OutputDescriptor:
      type: object
      description: Declared output metadata for a topology node. Values are not returned here.
      required:
        - name
        - type
        - sensitive
      properties:
        name:
          type: string
          description: Stable output accessor name, for example `host` or `public_url`.
        type:
          type: string
          description: Scalar value type exposed by this output.
          enum:
            - string
            - integer
            - boolean
        sensitive:
          type: boolean
          description: True when the output value is sensitive and should never be returned in normal metadata APIs.
    TopologyNode:
      type: object
      description: A node in the instance topology graph.
      required:
        - ref
        - label
      properties:
        ref:
          $ref: '#/components/schemas/TopologyNodeRef'
        label:
          type: string
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OutputDescriptor'
        state:
          type: string
          description: Optional runtime state for nodes that have status, such as instance resources or addons.
    TopologyEdge:
      type: object
      description: An edge in the instance topology graph.
      required:
        - kind
        - source
        - target
        - source_of_truth
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - env
            - volume_mount
            - build_artifact_source
            - depends_on
          description: Edge kind. Explicit connections reuse connection kinds; derived edges use depends_on.
        source:
          $ref: '#/components/schemas/TopologyNodeRef'
        target:
          $ref: '#/components/schemas/TopologyNodeRef'
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionMapping'
        config:
          $ref: '#/components/schemas/ApplicationInstanceConnectionConfig'
        source_of_truth:
          type: string
          enum:
            - connection
            - derived
          description: Whether the edge came from an explicit connection or a derived relationship such as depends_on.
    TopologyNodeRef:
      type: object
      description: Identifies a topology node within the instance graph.
      required:
        - type
      properties:
        type:
          type: string
          description: The node category.
          enum:
            - stack_resource
            - addon/postgres
            - secret
            - volume
            - object_store
        id:
          type: string
          description: Stable ID for persisted resources such as addons or secrets.
        name:
          type: string
          description: Name-scoped reference for instance-local resources.
    ConnectionMapping:
      type: object
      description: Maps one produced value into one target location on the consumer.
      required:
        - target
        - value
      properties:
        target:
          $ref: '#/components/schemas/ConnectionTarget'
        value:
          $ref: '#/components/schemas/ValueRef'
    ConnectionTarget:
      type: object
      description: The destination field that receives a mapped value.
      required:
        - type
      properties:
        type:
          type: string
          description: env writes an environment variable and file writes a mounted file path.
          enum:
            - env
            - file
        name:
          type: string
          description: Environment variable name when type is env.
        path:
          type: string
          description: Absolute file path when type is file.
    PostgresEnvConfig:
      type: object
      description: |
        Config for env connections from a PostgreSQL addon (kind=env, from.type=addon/postgres). credential_scope and superuser are mutually exclusive.
      properties:
        database:
          type: string
          description: Target database name within the addon.
        credential_scope:
          type: string
          enum:
            - owner
            - superuser
          description: Which credential set to inject. Mutually exclusive with superuser.
        superuser:
          type: boolean
          description: Use superuser credentials. Mutually exclusive with credential_scope.
      additionalProperties: false
    VolumeMountConfig:
      type: object
      description: Config for volume mount connections (kind=volume_mount).
      required:
        - mount_path
      properties:
        mount_path:
          type: string
          description: Absolute path where the volume is mounted in the container.
        sub_path:
          type: string
          description: Sub-path within the volume to mount.
        read_only:
          type: boolean
          description: Mount the volume read-only.
      additionalProperties: false
    BuildArtifactSourceConfig:
      type: object
      description: Config for build artifact source connections (kind=build_artifact_source).
      required:
        - source_path
      properties:
        source_path:
          type: string
          description: Path within the build output to copy from.
