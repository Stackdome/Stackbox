openapi: 3.0.0
info:
  title: Stackbox API
  version: 0.0.1-alpha
  description: Deploy, debug, and operate applications through the Stackdome REST API on Stackdome Cloud or a self-hosted installation. This API is in alpha and may change before general availability.
paths:
  /api/v1/auth/login:
    post:
      x-stability: draft
      summary: Sign in with an email and a password; sets the session cookies
      operationId: login
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in. Sets the httpOnly auth_token and refresh_token cookies; the body carries no token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { description: The body is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401':
          description: The email and password match no account. The same answer whether or not the email exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: invalid_credentials
                message: The email or password is not right
        '409':
          description: The email and password match accounts in several organizations and no organization_id was sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: choose_organization
                message: Choose the organization to sign in to
                details:
                  organizations:
                    - id: '00000000-0000-4000-8000-000000000001'
                      name: acme
        '429':
          description: Five failed sign ins for this email inside a fifteen minute window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: too_many_attempts
                message: Too many sign in attempts. Try again later.
                details:
                  retry_after_seconds: 840
  /api/v1/auth/refresh:
    post:
      x-stability: draft
      summary: Exchange the refresh_token cookie for a new pair of session cookies
      operationId: refreshSession
      tags:
        - Auth
      responses:
        '200':
          description: Session renewed. Sets both cookies again; the body carries no token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: The refresh cookie is missing, expired, or revoked by a sign out, a role change or a removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: invalid_refresh
                message: Sign in again
  /api/v1/auth/logout:
    post:
      x-stability: draft
      summary: Sign out on every device; clears both cookies
      operationId: logout
      security:
        - Bearer: []
      tags:
        - Auth
      responses:
        '204':
          description: Signed out. Every session of the account stops answering.
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/users/current:
    get:
      x-stability: draft
      summary: Get the signed in user with their organization
      operationId: getCurrentUser
      security:
        - Bearer: []
      tags:
        - Auth
      responses:
        '200':
          description: Current user fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}:
    get:
      x-stability: draft
      summary: Get the organization
      operationId: getOrganization
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Organization fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    patch:
      x-stability: draft
      summary: Rename the organization or change its monthly budget
      operationId: updateOrganization
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationUpdate'
      responses:
        '200':
          description: Organization updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400': { description: The name is blank or the budget is negative, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/users:
    get:
      x-stability: draft
      summary: List the organization's members, by name
      operationId: listMembers
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Members fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/users/{user_id}:
    patch:
      x-stability: draft
      summary: Change a member's role; the member signs in again
      operationId: updateMember
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/user_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdate'
      responses:
        '200':
          description: Role changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400': { description: The body is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404':
          description: The organization has no such member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: member_not_found
                message: member not found
        '409':
          description: The organization's last admin would lose the role, or the caller targets their own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                lastAdmin:
                  value:
                    code: last_admin
                    message: Make another member an admin first
                ownAccount:
                  value:
                    code: own_account
                    message: Ask another admin to change your own membership
    delete:
      x-stability: draft
      summary: Remove a member; removing a removed member answers the same
      operationId: removeMember
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/user_id'
      responses:
        '204':
          description: Member removed
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: The member is the organization's last admin, or the caller's own account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                lastAdmin:
                  value:
                    code: last_admin
                    message: Make another member an admin first
                ownAccount:
                  value:
                    code: own_account
                    message: Ask another admin to change your own membership
  /api/v1/organizations/{org_id}/invites:
    get:
      x-stability: draft
      summary: List the organization's invites, pending first, newest first
      operationId: listInvites
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Invites fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      x-stability: draft
      summary: Invite an email into the organization; the link is shown once
      operationId: createInvite
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCreate'
      responses:
        '201':
          description: Invite created, pending for seven days
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCreated'
        '400': { description: The body is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: The email is already a member, or already has a pending invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                memberExists:
                  value:
                    code: member_exists
                    message: This email is already a member of the organization
                invitePending:
                  value:
                    code: invite_pending
                    message: This email already has a pending invite
  /api/v1/organizations/{org_id}/invites/{invite_id}:
    delete:
      x-stability: draft
      summary: Revoke a pending invite; revoking it again answers the same
      operationId: revokeInvite
      security:
        - Bearer: []
      tags:
        - Organizations
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: invite_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Invite revoked
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/invites/{token}:
    get:
      x-stability: draft
      summary: Read what an invite link offers, without signing in
      operationId: getInvitePreview
      tags:
        - Invites
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invite found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitePreview'
        '404':
          description: The token matches no invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unknown_invite
                message: This invite link does not match any invite
  /api/v1/invites/{token}/accept:
    post:
      x-stability: draft
      summary: Join the invite's organization with the invite's role; sets the session cookies
      operationId: acceptInvite
      tags:
        - Invites
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteAccept'
      responses:
        '200':
          description: Account created and signed in. Sets both cookies; the body carries no token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400': { description: The name is blank or the password is under eight characters, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404':
          description: The token matches no invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unknown_invite
                message: This invite link does not match any invite
        '409':
          description: The invite was accepted, revoked or has expired, or the email joined in the meantime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                inviteNotPending:
                  value:
                    code: invite_not_pending
                    message: This invite was already accepted, revoked or has expired
                memberExists:
                  value:
                    code: member_exists
                    message: This email is already a member of the organization
  /api/v1/api-tokens:
    get:
      x-stability: draft
      summary: List the signed in user's API tokens, newest first
      operationId: listApiTokens
      security:
        - Bearer: []
      tags:
        - API tokens
      responses:
        '200':
          description: API tokens fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      x-stability: draft
      summary: Create a personal API token that acts as its user; the secret is shown once
      operationId: createApiToken
      security:
        - Bearer: []
      tags:
        - API tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiTokenCreate'
      responses:
        '201':
          description: API token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenCreated'
        '400': { description: The body is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/api-tokens/{token_id}:
    delete:
      x-stability: draft
      summary: Revoke one of your API tokens; revoking it again answers the same
      operationId: revokeApiToken
      security:
        - Bearer: []
      tags:
        - API tokens
      parameters:
        - name: token_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: API token revoked
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404':
          description: The token is not one of the signed in user's
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: api_token_not_found
                message: API token not found
  /api/v1/organizations/{org_id}/tasks:
    get:
      x-stability: draft
      summary: List the organization's tasks, Needs you first, then newest first
      operationId: listTasks
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CoarseStatus'
        - name: application_id
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Matches the report description
          schema:
            type: string
      responses:
        '200':
          description: Tasks fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-stability: draft
      summary: Create a report and its task in one call
      operationId: createTask
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created in phase intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          description: The body is invalid or names an unsupported task kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unsupported_task_kind
                message: Tasks of kind onboarding are not supported yet
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/tasks/{task_id}:
    get:
      x-stability: draft
      summary: Get one task as the Task detail screen draws it
      operationId: getTask
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/tasks/{task_id}/cancel:
    post:
      x-stability: draft
      summary: Cancel a task that has not finished
      operationId: cancelTask
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The task has already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/tasks/{task_id}/events:
    get:
      x-stability: draft
      summary: List the task's timeline events, oldest first
      operationId: listTaskEvents
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Events fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEventList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/checks:
    get:
      x-stability: draft
      summary: List the task's checks, oldest first
      operationId: listTaskChecks
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checks fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCheckList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/runs:
    get:
      x-stability: draft
      summary: List the task's runs by number, each with its cost and failed check
      operationId: listTaskRuns
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runs fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/messages:
    get:
      x-stability: draft
      summary: List the task's conversation, oldest first
      operationId: listTaskMessages
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Messages fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMessageList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      x-stability: draft
      summary: Append a message; answers the open blocking question and resumes the diverted phase when the task needs input
      operationId: createTaskMessage
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMessageCreate'
      responses:
        '200':
          description: Message appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMessage'
        '400': { description: The body is empty, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/artifacts:
    get:
