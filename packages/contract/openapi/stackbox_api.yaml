                releaseInFlight:
                  value:
                    code: release_in_flight
                    message: Wait for the release in flight to finish first
                instanceNotRunning:
                  value:
                    code: instance_not_running
                    message: This instance has expired or been torn down
  /api/v1/organizations/{org_id}/instances/{instance_id}/teardown:
    post:
      x-stability: draft
      summary: Tear an instance down; tearing down a torn down instance answers it unchanged
      operationId: teardownInstance
      security:
        - Bearer: []
      tags:
        - Instances
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Instance torn down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDetail'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Instance not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/instances/{instance_id}/expiry:
    post:
      x-stability: draft
      summary: Set the instance to expire a preset number of hours from now
      operationId: extendInstanceExpiry
      security:
        - Bearer: []
      tags:
        - Instances
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstanceExpiryExtend'
      responses:
        '200':
          description: Expiry moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstanceDetail'
        '400': { description: The body is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Instance not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409':
          description: The instance is persistent, or has expired or been torn down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                noExpiry:
                  value:
                    code: instance_has_no_expiry
                    message: A persistent instance never expires
                instanceNotRunning:
                  value:
                    code: instance_not_running
                    message: This instance has expired or been torn down
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      description: The id of record
      required: true
      schema:
        type: string
    org_id:
      name: org_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the organization
    cluster_id:
      name: cluster_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the cluster
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the user
    resource_name:
      name: resource_name
      in: path
      required: true
      schema:
        type: string
      description: The name of the instance resource
    connection_id:
      name: connection_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the instance connection
    build_id:
      name: build_id
      in: path
      required: true
      schema:
        type: string
      description: The ID of the build
    database:
      name: database
      in: path
      required: true
      schema:
        type: string
      description: The name of the database
  schemas:
    Error:
      allOf:
        - $ref: '#/components/schemas/ObjectReference'
