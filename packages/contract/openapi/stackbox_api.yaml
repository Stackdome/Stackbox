openapi: 3.0.0
info:
  title: Stackbox API
  version: 0.0.1-alpha
  description: Deploy, debug, and operate applications through the Stackdome REST API on Stackdome Cloud or a self-hosted installation. This API is in alpha and may change before general availability.
paths:
  /api/v1/user-signup:
    post:
      summary: Create new user
      description: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSignupRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSignupResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: User already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/config:
    get:
      summary: Get public application configuration
      description: Returns feature flags the web client needs before authentication, such as whether GitHub OAuth is enabled.
      responses:
        '200':
          description: Application configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppConfigResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/{id}:
    get:
      security:
        - Bearer: []
      summary: Get a user
      description: Get a user
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/users/current:
    get:
      security:
        - Bearer: []
      summary: Get the current authenticated user
      responses:
        '200':
          description: User fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/login:
    post:
      summary: User login
      description: Authenticate user and generate an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/refresh:
    post:
      summary: Refresh JWT token
      description: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/auth/github:
    get:
      summary: Initiate GitHub OAuth flow
      description: Redirects the user to GitHub for OAuth authorization
      responses:
        '302':
          description: Redirect to GitHub OAuth authorization page
        '500':
          description: Internal server error
  /api/v1/auth/github/callback:
    get:
      summary: GitHub OAuth callback
      description: Handles the callback from GitHub after OAuth authorization
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OAuth login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: OAuth authorization failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/api-tokens:
    post:
      security:
        - Bearer: []
      summary: Create a new API token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APITokenCreateRequest'
      responses:
        '201':
          description: API token created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenCreateResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      security:
        - Bearer: []
      summary: List all API tokens for the current user
      responses:
        '200':
          description: API tokens listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokenList'
  /api/v1/api-tokens/scopes:
    get:
      security:
        - Bearer: []
      summary: List all available API token scopes
      description: Returns the list of resources and their allowed actions that can be used when creating API tokens
      responses:
        '200':
          description: Scopes listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScopeList'
        '401':
          description: Unauthorized
  /api/v1/api-tokens/{id}:
    get:
      security:
        - Bearer: []
      summary: Get an API token by ID
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: API token fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIToken'
        '404':
          description: API token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      security:
        - Bearer: []
      summary: Revoke an API token
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: API token revoked successfully
        '404':
          description: API token not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{id}:
    get:
      security:
        - Bearer: []
      summary: Get an organization
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Organization fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      security:
        - Bearer: []
      summary: Update an organization
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Organisation'
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organisation'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Auth token is invalid
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Unauthorized to perform operation
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/users:
    get:
      summary: List all users in an organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number
        - in: query
          name: page_size
          schema:
            type: integer
            default: 20
          description: Number of items per page
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/admins:
    post:
      summary: Promote a user to organization admin
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteAdminRequest'
      responses:
        '200':
          description: User promoted to admin successfully
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List organization admins
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/admins/{user_id}/demote:
    post:
      summary: Demote an organization admin
      description: Demotes an OrgAdmin.
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/user_id'
      responses:
        '204':
          description: Admin demoted successfully
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: User not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/invites:
    post:
      summary: Create an invite to the organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgInviteCreateRequest'
      responses:
        '201':
          description: Invite created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgInviteCreateResponse'
        '400':
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
        '409':
          description: Conflict - user exists or duplicate pending invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
    get:
      summary: List invites for an organization
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: Filter invites by status (pending, accepted, revoked, expired)
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgInviteList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/invites/{id}:
    get:
      summary: Get an invite by ID
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgInvite'
        '401':
          description: Unauthorized
        '404':
          description: Invite not found
        '500':
          description: Internal server error
    delete:
      summary: Revoke a pending invite
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          description: Invite revoked successfully
        '400':
          description: Can only revoke pending invites
        '401':
          description: Unauthorized
        '404':
          description: Invite not found
        '500':
          description: Internal server error
  /api/v1/organizations/{org_id}/invites/{id}/resend:
    post:
      summary: Re-queue invite email for delivery
      security:
        - Bearer: []
      parameters:
        - $ref: '#/components/parameters/org_id'
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: Invite email re-queued
        '400':
          description: Can only resend pending invites
        '401':
          description: Unauthorized
        '404':
          description: Invite not found
        '500':
          description: Internal server error
  /api/v1/invites/{token}/info:
    get:
      summary: Get public invite info (unauthenticated)
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: The invite token
      responses:
        '200':
          description: Invite info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgInviteInfo'
        '404':
          description: Invite not found
        '410':
          description: Invite expired or revoked
  /api/v1/organizations/{org_id}/tasks:
    get:
      x-stability: draft
      summary: List the organization's tasks, Needs you first, then newest first
      operationId: listTasks
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/CoarseStatus'
        - name: application_id
          in: query
          required: false
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Matches the report description
          schema:
            type: string
      responses:
        '200':
          description: Tasks fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      x-stability: draft
      summary: Create a report and its task in one call
      operationId: createTask
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: Task created in phase intake
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          description: The body is invalid or names an unsupported task kind
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: unsupported_task_kind
                message: Tasks of kind onboarding are not supported yet
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Application not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/tasks/{task_id}:
    get:
      x-stability: draft
      summary: Get one task as the Task detail screen draws it
      operationId: getTask
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/tasks/{task_id}/cancel:
    post:
      x-stability: draft
      summary: Cancel a task that has not finished
      operationId: cancelTask
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSummary'
        '401':
          description: Auth token is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Unauthorized to perform operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The task has already finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/organizations/{org_id}/tasks/{task_id}/events:
    get:
      x-stability: draft
      summary: List the task's timeline events, oldest first
      operationId: listTaskEvents
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Events fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskEventList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/checks:
    get:
      x-stability: draft
      summary: List the task's checks, oldest first
      operationId: listTaskChecks
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Checks fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCheckList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/runs:
    get:
      x-stability: draft
      summary: List the task's runs by number, each with its cost and failed check
      operationId: listTaskRuns
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runs fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskRunList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/messages:
    get:
      x-stability: draft
      summary: List the task's conversation, oldest first
      operationId: listTaskMessages
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Messages fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMessageList'
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      x-stability: draft
      summary: Append a message; answers the open blocking question and resumes the diverted phase when the task needs input
      operationId: createTaskMessage
      security:
        - Bearer: []
      tags:
        - Tasks
      parameters:
        - $ref: '#/components/parameters/org_id'
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskMessageCreate'
      responses:
        '200':
          description: Message appended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskMessage'
        '400': { description: The body is empty, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Auth token is invalid, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Unauthorized to perform operation, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: Task not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/v1/organizations/{org_id}/tasks/{task_id}/artifacts:
