name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stackbox_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5433/stackbox_test
      CI: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated contract is committed
        run: |
          pnpm generate
          git diff --exit-code packages/contract/src/generated
      - name: Chromium for the story, theme and e2e projects
        run: pnpm --filter @stackbox/e2e exec playwright install --with-deps chromium
      - run: pnpm -r lint
      - run: pnpm -r typecheck
      - run: pnpm test:run
      - run: pnpm --filter @stackbox/web exec storybook build --test
      - run: pnpm e2e
